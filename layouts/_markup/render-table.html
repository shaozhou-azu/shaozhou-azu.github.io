{{- $columns := len (index .THead 0) -}}
<div class="table-scroll{{ if ge $columns 5 }} table-wide{{ end }}" data-columns="{{ $columns }}" tabindex="0" role="region" aria-label="文章表格，可横向滚动">
  <table
    {{- range $key, $value := .Attributes }}
      {{- if $value }}{{ printf " %s=%q" $key $value | safeHTMLAttr }}{{ end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
